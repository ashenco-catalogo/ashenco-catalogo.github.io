<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ashen inv">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ashen co. · Inventario</title>
<style>
/*
VOICE: tranquila y directa, como la libreta de una vendedora que sabe lo que tiene.
IDEA: la etiqueta colgante de una prenda: nombre, talla, precio, a la vista.
PICTURE: la lista de prendas con foto y tallas es la pantalla; nada antes de ella.
COLOUR and TYPE: ceniza (#111 a #2c2c2c), blanco hueso, brasa #ff7a45 para acciones; letra del sistema, grande.
LAYOUT: todo cae hacia el pulgar: pestañas abajo, botón de acción abajo a la derecha, formularios en hojas que suben.
*/
:root{color-scheme:dark;--bg:#111;--s1:#1a1a1a;--s2:#232323;--s3:#2e2e2e;--line:#2f2f2f;--ink:#f3f0eb;--mute:#a09a92;--em:#ff7a45;--em2:#ffa27a;--ok:#86d692;--warn:#ffcf5a;--bad:#ff6b6b;--tabh:66px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(var(--tabh) + var(--sb) + 96px);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--em);outline-offset:1px}
.top{position:sticky;top:0;z-index:5;background:rgba(17,17,17,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(var(--st) + 12px) 18px 11px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:-.02em;font-size:21px}
.brand i{color:var(--em);font-style:normal}
.top h1{margin:0;font-size:15px;font-weight:600;color:var(--mute);display:flex;gap:10px;align-items:baseline}
.sync{font-size:12.5px;font-weight:500;color:var(--warn)}
main{padding:14px 14px 0;max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--s1);padding:0 16px 0 50px;font-size:17px}
.search svg{position:absolute;left:16px;top:17px;width:22px;height:22px;fill:none;stroke:var(--mute);stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:#111;border-color:var(--ink);font-weight:650}
.chip.warn:not(.on){color:var(--warn)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;text-align:left;width:100%}
.item:active{background:var(--s2)}
.thumb{width:64px;height:64px;border-radius:13px;background:var(--s3) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:24px;color:var(--mute);flex:none}
.thumb.sm{width:46px;height:46px;font-size:18px;border-radius:11px}
.item b,.pick b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:14px}
.tz{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tz span{font-size:13px;padding:1px 7px;border-radius:7px;background:var(--s3);white-space:nowrap}
.low{color:var(--warn)}.out{color:var(--bad)}
.tz .low{background:rgba(255,207,90,.14)}.tz .out{background:rgba(255,107,107,.14)}
.qty{text-align:right;font-weight:750;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:44px 18px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + var(--sb) + 14px);height:62px;padding:0 24px 0 20px;border-radius:20px;border:0;background:var(--em);color:#1d0e06;font-size:18px;font-weight:750;box-shadow:0 10px 28px rgba(255,122,69,.3);z-index:6;display:flex;align-items:center;gap:8px}
.fab span{font-size:30px;font-weight:500;line-height:1;margin-top:-3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#161616;border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs button{height:var(--tabh);border:0;background:none;color:var(--mute);font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:650}
.tabs button.on svg{stroke:var(--em)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--warn);color:#111;font-size:11px;font-weight:800;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--mute)}
.card p{margin:4px 0 12px;color:var(--mute);font-size:15px}
.big{font-size:clamp(30px,9vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.08;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis span{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.card .row:first-of-type{border-top:0}
.row>span:last-child{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.row small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,207,90,.1);border:1px solid rgba(255,207,90,.35);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner button{flex:none;height:42px;border-radius:12px;border:0;background:var(--warn);color:#111;font-weight:700;padding:0 14px}
.day{display:flex;justify-content:space-between;gap:10px;margin:16px 4px 8px;font-size:14px;color:var(--mute)}
.day b{color:var(--ink);font-weight:600}
.day:first-child{margin-top:2px}
.mv{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;width:100%;text-align:left}
.sign{height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--s3)}
.sign.entrada{background:rgba(134,214,146,.14);color:var(--ok)}
.sign.venta{background:rgba(255,122,69,.16);color:var(--em2)}
.mv b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.mv .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.more{width:100%;height:52px;margin-top:12px;border-radius:14px;border:1px dashed var(--line);background:none;color:var(--mute)}
.btn{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--s2);font-weight:650;padding:0 18px;flex:1;font-size:17px}
.btn.pri{background:var(--em);border-color:var(--em);color:#1d0e06}
.btn.danger{color:var(--bad)}
.btn.dangerf{background:var(--bad);border-color:var(--bad);color:#1b0606}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}
/* hoja inferior */
.wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s}
.wrap.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:94vh;max-height:94dvh;background:#181818;border-radius:24px 24px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s ease}
.wrap.on .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.sh-head h3{margin:0;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.x{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--s2);font-size:24px;line-height:1}
.sh-body{overflow-y:auto;padding:4px 16px 20px;flex:1;overscroll-behavior:contain}
.sh-body h4{margin:20px 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.sh-foot{padding:12px 16px calc(12px + var(--sb));border-top:1px solid var(--line);display:flex;gap:10px}
label.f{display:block;margin:16px 0 7px;font-size:14px;color:var(--mute)}
.in{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--s1);padding:0 14px;font-size:17px}
input[type=date].in{display:block;-webkit-appearance:none;appearance:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two label.f{margin-top:16px}
.hint{font-size:14px;color:var(--mute);margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;background:var(--s1);padding:5px;border-radius:17px;border:1px solid var(--line)}
.seg button{height:50px;border:0;border-radius:13px;background:none;font-weight:650;color:var(--mute);font-size:16px}
.seg button.on{background:var(--s3);color:var(--ink)}
.seg button.on[data-t=entrada]{background:rgba(134,214,146,.16);color:var(--ok)}
.seg button.on[data-t=venta]{background:rgba(255,122,69,.18);color:var(--em2)}
.step{display:grid;grid-template-columns:66px minmax(0,1fr) 66px;gap:8px}
.step button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--s2);font-size:30px}
.step input{text-align:center;font-size:28px;font-weight:750;height:62px}
.tallas{display:flex;flex-wrap:wrap;gap:8px}
.tallas button{min-width:60px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-weight:700;padding:0 12px;line-height:1.15}
.tallas button small{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.tallas button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.tallas button.on small{color:#555}
.addt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.addt .btn{flex:none;height:56px}
.photo{width:100%;aspect-ratio:4/3;max-height:280px;border-radius:18px;background:var(--s1) center/cover no-repeat;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mute);text-align:center;font-size:15px;cursor:pointer}
.photo.has{border-style:solid;color:transparent}
.photo svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;display:block;margin:0 auto 6px}
.linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;padding:10px 2px;font-size:15px}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.prices div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.prices small{display:block;font-size:12.5px;color:var(--mute)}
.prices b{display:block;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.tn{height:48px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:16px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tq{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.tq small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.tq.low small,.tq.out small{color:inherit}
.mini{height:48px;border-radius:13px;border:1px solid var(--line);background:var(--s2);font-weight:650;padding:0 12px;font-size:15px;white-space:nowrap}
.mini.pri{background:var(--em);border-color:var(--em);color:#1d0e06}
.pick{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px}
.picklist{display:grid;gap:8px}
.total{margin-top:10px;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.total b{color:var(--ink)}
.check{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:15px;color:var(--mute)}
.check input{width:24px;height:24px;accent-color:var(--em);flex:none}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:6px 0}
.dl dt{color:var(--mute);font-size:15px}.dl dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
/* diálogo y aviso */
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + var(--sb))}
.dlg.on{display:flex}
.dlg-box{width:100%;max-width:460px;background:#1c1c1c;border:1px solid var(--line);border-radius:22px;padding:20px}
.dlg-box h3{margin:0 0 6px;font-size:20px}
.dlg-box p{margin:0 0 18px;color:var(--mute);font-size:15.5px}
.dlg-btns{display:flex;gap:10px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-20px);background:var(--ink);color:#111;font-weight:650;padding:12px 18px;border-radius:14px;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);text-align:center;font-size:15.5px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:var(--bad);border-radius:16px;padding:14px;margin-bottom:12px;font-size:15px}
@media (prefers-reduced-motion:reduce){.sheet,.wrap,.toast{transition:none}}
@media (min-width:700px){.fab{right:calc(50% - 344px)}}
</style>
</head>
<body>
<header class="top"><div class="brand">ashen co<i>.</i></div><h1><span class="sync" id="tsync"></span><span class="sync" id="sync"></span><span id="titulo">Inventario</span></h1></header>
<main>
  <div class="err" id="err" hidden></div>

  <section class="view on" id="v-inv">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><input id="buscar" type="search" placeholder="Buscar por nombre" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips" id="cats"></div>
    <div class="list" id="lista"></div>
  </section>

  <section class="view" id="v-mov">
    <div class="chips" id="fmov"></div>
    <div id="movs"></div>
  </section>

  <section class="view" id="v-res"><div id="res"></div></section>

  <section class="view" id="v-aj"><div id="aj"></div></section>
</main>

<button class="fab" id="fab"><span>+</span><em id="fabTxt" style="font-style:normal">Producto</em></button>

<nav class="tabs" id="tabs">
  <button data-v="inv" class="on"><svg viewBox="0 0 24 24"><path d="M9 4h6l1.5 2.5L21 8l-2 4-2-.8V20H7v-8.8L5 12 3 8l4.5-1.5Z"/></svg>Inventario<span class="badge" id="badge" hidden></span></button>
  <button data-v="mov"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>Movimientos</button>
  <button data-v="res"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m5 7H3"/></svg>Resumen</button>
  <button data-v="aj"><svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>

<div class="wrap" id="wrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="dlg" id="dlg"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv,text/plain" hidden>

<script>
{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{n=Math.round(Number(n)||0);return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('es-CO')};
const miles=n=>n?Number(n).toLocaleString('es-CO'):'';
const num=v=>Number(String(v??'').replace(/\D/g,''))||0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const fechaTxt=(f,o={weekday:'long',day:'numeric',month:'long'})=>{const [y,m,d]=f.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-CO',o)};
const fotoOk=f=>typeof f==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(f);
const inicial=s=>esc((String(s||'?').trim()[0]||'?').toUpperCase());
const thumb=(p,cls='')=>p&&p.foto?`<span class="thumb ${cls}" style="background-image:url('${p.foto}')"></span>`:`<span class="thumb ${cls}">${inicial(p&&p.nombre)}</span>`;
const TALLAS=['XS','S','M','L','XL','XXL','Única'];
const CATS=['Blusas','Camisetas','Tops','Vestidos','Jeans','Pantalones','Faldas','Shorts','Chaquetas','Buzos','Conjuntos','Accesorios'];
const TIPOS={entrada:'Entrada',venta:'Venta',salida:'Otra salida'};

let db,P=[],M=[],C={minimo:2,ultimoBackup:null};
let vista='inv',filtroCat='Todas',filtroMov='todos',q='',instalar=null,limite=120;

/* ---------- almacenamiento ----------
   Dentro de Claude: base de datos privada de la persona (data/users/<id>/), igual en todos sus dispositivos.
   Como app instalada por su cuenta: IndexedDB, solo en ese celular. */
const enMarco=(()=>{try{return window.top!==window}catch(e){return true}})();
let modo='local',cdb=null,uidU=null,dlc=null,pendientes=0,idb;
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const colas={};
function enCola(k,fn){const p=(colas[k]||Promise.resolve()).catch(()=>{}).then(fn);colas[k]=p;return p}
async function intentar(fn){for(let i=0;;i++){try{return await fn()}catch(e){const c=e&&e.code;if(i<3&&(c==='unavailable'||c==='resource_exhausted'||c==='rate_limited')){await espera(500*(i+1)+Math.random()*500);continue}throw e}}}
async function pool(tareas,n=4){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<tareas.length){const t=tareas[i++];await t()}}))}
const col=()=>cdb.collection('data/users/'+uidU);
const ref=k=>col().doc(k);
function abrirIDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ashen-inventario',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('productos',{keyPath:'id'});d.createObjectStore('movimientos',{keyPath:'id'});d.createObjectStore('config',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function run(stores,fn){return new Promise((res,rej)=>{const t=idb.transaction(stores,'readwrite');fn(t);t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)})}
function todos(st){return new Promise((res,rej)=>{const r=idb.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const escribirDia=f=>enCola('d_'+f,()=>{const items=M.filter(m=>m.fecha===f);return intentar(()=>items.length?ref('d_'+f).set({fecha:f,items}):ref('d_'+f).delete())});
const S_={
  async cargar(){
    if(modo==='nube'){const snap=await intentar(()=>col().get());const ps=[],ms=[];
      for(const d of snap.docs){const v=d.data()||{};
        if(d.id.startsWith('p_')){if(v.id&&v.nombre)ps.push(limpiarP(v))}
        else if(d.id.startsWith('d_')){if(Array.isArray(v.items))for(const m of v.items)if(m&&m.id&&m.pid&&m.talla!=null)ms.push(limpiarM(m))}
        else if(d.id==='cfg'){if(Number.isFinite(Number(v.minimo)))C.minimo=Math.max(0,Math.round(Number(v.minimo)));if(Number(v.ultimoBackup))C.ultimoBackup=Number(v.ultimoBackup)}}
      P=ps;M=ms.filter(m=>m.cant>0);return}
    idb=idb||await abrirIDB();const [ps,ms,cf]=await Promise.all([todos('productos'),todos('movimientos'),todos('config')]);P=ps;M=ms;const c=cf.find(x=>x.k==='cfg');if(c){delete c.k;Object.assign(C,c)}},
  putP(p){return modo==='nube'?enCola('p_'+p.id,()=>intentar(()=>ref('p_'+p.id).set(p))):run('productos',t=>t.objectStore('productos').put(p))},
  delP(id){return modo==='nube'?enCola('p_'+id,()=>intentar(()=>ref('p_'+id).delete())):run('productos',t=>t.objectStore('productos').delete(id))},
  putMs(ms){return modo==='nube'?Promise.all([...new Set(ms.map(m=>m.fecha))].map(escribirDia)):run('movimientos',t=>ms.forEach(m=>t.objectStore('movimientos').put(m)))},
  delM(m){return modo==='nube'?escribirDia(m.fecha):run('movimientos',t=>t.objectStore('movimientos').delete(m.id))},
  putC(){return modo==='nube'?enCola('cfg',()=>intentar(()=>ref('cfg').set({minimo:C.minimo,ultimoBackup:C.ultimoBackup||0}))):run('config',t=>t.objectStore('config').put({k:'cfg',...C}))},
  async replace(ps,ms){
    if(modo==='nube'){const snap=await intentar(()=>col().get());const quedan=new Set([...ps.map(p=>'p_'+p.id),...ms.map(m=>'d_'+m.fecha)]);
      await pool(snap.docs.filter(d=>d.id!=='cfg'&&!quedan.has(d.id)).map(d=>()=>enCola(d.id,()=>intentar(()=>ref(d.id).delete()))));
      await pool([...ps.map(p=>()=>S_.putP(p)),...[...new Set(ms.map(m=>m.fecha))].map(f=>()=>escribirDia(f))]);return}
    return run(['productos','movimientos'],t=>{const a=t.objectStore('productos'),b=t.objectStore('movimientos');a.clear();b.clear();ps.forEach(p=>a.put(p));ms.forEach(m=>b.put(m))})}
};
let pedidoPersist=false;
function persistir(){if(pedidoPersist)return;pedidoPersist=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function estadoGuardado(){const el=$('#sync');el.textContent=pendientes>0?'Guardando…':'';el.classList.toggle('busy',pendientes>0)}
async function guardar(fn){pendientes++;estadoGuardado();try{await fn();if(modo==='local')persistir();programarTienda();return true}
  catch(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de guardado. Borra fotos o productos que ya no uses.':'No se pudo guardar el último cambio. Revisa tu conexión y vuelve a intentarlo.');return false}
  finally{pendientes--;estadoGuardado()}}

/* ---------- tienda en línea (GitHub Pages) ----------
   Solo se publica qué tallas están agotadas (campos "ag" y "agotado" de datos.json).
   Costos, cantidades y ventas se quedan en este celular. */
const HOST=window.__HOST||location.hostname;
const GH={owner:/\.github\.io$/.test(HOST)?HOST.split('.')[0]:'',repo:'',br:'main',tok:'',ok:false};
GH.repo=GH.owner?GH.owner+'.github.io':'';
try{GH.tok=localStorage.getItem('ac-gh')||'';GH.br=localStorage.getItem('ac-gh-br')||'main'}catch(e){}
let TIENDA=[],tEstado=GH.owner?(GH.tok?'':'sin-llave'):'no-web',tTimer=null,tOcupado=false,tOtra=false;
const T_TXT={ok:'La tienda está al día',enviando:'Actualizando la tienda…','sin-llave':'Falta conectar tu llave de GitHub',llave:'La llave de GitHub no sirve o venció',offline:'Sin internet: la tienda se actualiza cuando vuelva la señal',error:'No se pudo actualizar la tienda. Se reintenta solo.','no-web':'Abre el inventario desde tu página para conectarlo'};
function setTienda(e){tEstado=e;const el=$('#tsync');el.textContent=e==='enviando'?'Tienda…':(e==='llave'||e==='error'||e==='offline'||e==='sin-llave')&&GH.owner?'Tienda sin actualizar':'';if(vista==='aj')renderAj()}
async function gh(path,opt={}){const r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+path,{method:opt.method||'GET',cache:'no-store',headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.tok},opt.body?{'Content-Type':'application/json'}:{}),body:opt.body?JSON.stringify(opt.body):undefined});if(!r.ok){const e=new Error('gh '+r.status);e.status=r.status;throw e}return r.json()}
function b64enc(str){const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function leerTienda(){
  if(GH.tok){try{const f=await gh('/contents/datos.json?ref='+encodeURIComponent(GH.br));const txt=f.content?b64dec(f.content):b64dec((await gh('/git/blobs/'+f.sha)).content);return{D:JSON.parse(txt),sha:f.sha}}catch(e){if(e.status!==404)throw e}}
  else{try{const r=await fetch('./datos.json',{cache:'no-cache'});if(r.ok)return{D:await r.json(),sha:null}}catch(e){}}
  const html=await (await fetch('./',{cache:'no-cache'})).text();const m=html.match(/<script type="application\/json" id="datos">([\s\S]*?)<\/script>/);if(!m)throw new Error('sin datos');return{D:JSON.parse(m[1]),sha:null}}
const tiendaDe=p=>p&&p.web?TIENDA.find(t=>t.id===p.web):null;
function aplicarAg(D){let cambio=false;const S=stockMap();
  for(const rp of D.productos||[]){
    const p=P.find(x=>x.web===rp.id);const seguido=p&&M.some(m=>m.pid===p.id);
    const antes=JSON.stringify([rp.ag||[],!!rp.agotado]);
    if(seguido){const s=S[p.id]||{};const ag=p.tallas.filter(t=>(s[t]||0)<=0);if(ag.length)rp.ag=ag;else delete rp.ag;if(p.tallas.length&&ag.length===p.tallas.length)rp.agotado=true;else delete rp.agotado}
    else{delete rp.ag;delete rp.agotado}
    if(JSON.stringify([rp.ag||[],!!rp.agotado])!==antes)cambio=true}
  return cambio}
function programarTienda(ms=2500){if(!GH.owner||!GH.tok)return;clearTimeout(tTimer);tTimer=setTimeout(empujar,ms)}
async function empujar(){
  if(tOcupado){tOtra=true;return}if(!GH.tok){setTienda('sin-llave');return}
  tOcupado=true;setTienda('enviando');
  try{for(let i=0;i<3;i++){const {D,sha}=await leerTienda();TIENDA=D.productos||[];
      if(!aplicarAg(D)){setTienda('ok');break}
      try{await gh('/contents/datos.json',{method:'PUT',body:Object.assign({message:'Inventario: actualiza tallas agotadas',content:b64enc(JSON.stringify(D).replace(/</g,'\\u003c')),branch:GH.br},sha?{sha}:{})});setTienda('ok');break}
      catch(e){if((e.status===409||e.status===422)&&i<2)continue;throw e}}}
  catch(e){console.error(e);setTienda(e.status===401||e.status===403?'llave':navigator.onLine===false?'offline':'error')}
  finally{tOcupado=false;if(tOtra){tOtra=false;programarTienda(500)}}}
async function conectarLlave(tok){GH.tok=tok.trim();const r=await gh('');if(!r.permissions||!r.permissions.push){GH.tok='';throw new Error('sin permiso')}GH.br=r.default_branch||'main';try{localStorage.setItem('ac-gh',GH.tok);localStorage.setItem('ac-gh-br',GH.br)}catch(e){}}
async function iniciarTienda(){if(!GH.owner)return;
  if(GH.tok){try{const r=await gh('');GH.br=r.default_branch||GH.br;try{localStorage.setItem('ac-gh-br',GH.br)}catch(e){}}catch(e){if(e.status===401||e.status===403||e.status===404){setTienda('llave')}}}
  try{const {D}=await leerTienda();TIENDA=D.productos||[]}catch(e){}
  if(GH.tok&&tEstado!=='llave')programarTienda(1200);if(vista==='aj')renderAj()}
addEventListener('online',()=>{if(tEstado!=='ok')programarTienda(800)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tEstado&&tEstado!=='ok'&&tEstado!=='llave')programarTienda(800)});

/* ---------- cálculos ---------- */
function stockMap(){const S={};for(const m of M){const a=S[m.pid]||(S[m.pid]={});a[m.talla]=(a[m.talla]||0)+(m.tipo==='entrada'?m.cant:-m.cant)}return S}
const minDe=p=>p.minimo==null||p.minimo===''?C.minimo:Number(p.minimo);
const estado=(n,p)=>n<=0?'out':n<=minDe(p)?'low':'';
function bajos(S){const o=[];for(const p of P){const s=S[p.id]||{};for(const t of p.tallas){const n=s[t]||0;if(n<=minDe(p))o.push({p,t,n})}}return o}
const pmap=()=>Object.fromEntries(P.map(p=>[p.id,p]));
const ordenM=(a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts;

function renderInv(S){
  const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(filtroCat!=='Todas'&&filtroCat!=='Stock bajo'&&!cats.includes(filtroCat))filtroCat='Todas';
  $('#cats').innerHTML=['Todas','Stock bajo',...cats].map(c=>`<button class="chip ${c==='Stock bajo'?'warn':''} ${c===filtroCat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  let l=P.filter(p=>!q||norm(p.nombre).includes(norm(q)));
  if(filtroCat==='Stock bajo')l=l.filter(p=>p.tallas.some(t=>((S[p.id]||{})[t]||0)<=minDe(p)));
  else if(filtroCat!=='Todas')l=l.filter(p=>p.cat===filtroCat);

  if(!l.length){$('#lista').innerHTML=`<div class="empty"><b>Nada por aquí</b>${q?'Ningún producto se llama así.':'No hay productos en este filtro.'}</div>`;return}
  $('#lista').innerHTML=l.map(p=>{const s=S[p.id]||{};const tot=p.tallas.reduce((a,t)=>a+(s[t]||0),0);
    return `<button class="item" data-p="${esc(p.id)}">${thumb(p)}<span><b>${esc(p.nombre)}</b><span class="sub">${esc(p.cat||'Sin categoría')} · ${money(p.precio)}</span><span class="tz">${p.tallas.map(t=>{const n=s[t]||0;return `<span class="${estado(n,p)}">${esc(t)} ${n}</span>`}).join('')}</span></span><span class="qty">${tot}<small>en stock</small></span></button>`}).join('');
}

function verProducto(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const s=stockMap()[id]||{};const g=p.precio-p.costo;const mg=p.precio?Math.round(g/p.precio*100):0;
  const tot=p.tallas.reduce((a,t)=>a+(s[t]||0),0);
  const ms=M.filter(m=>m.pid===id).sort(ordenM).slice(0,10);
  hoja(`<div class="sh-head"><h3>${esc(p.nombre)}</h3><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sh-body">
    ${p.foto?`<div class="photo has" style="background-image:url('${p.foto}')"></div>`:''}
    <div class="sub" style="margin-top:${p.foto?12:0}px">${esc(p.cat||'Sin categoría')} · ${tot} en stock · aviso con ${minDe(p)} o menos</div>
    ${p.web?`<div class="sub" style="margin-top:4px">En tu página como: <b style="color:var(--ink)">${esc((tiendaDe(p)||{}).n||p.web)}</b>${tot<=0&&M.some(m=>m.pid===p.id)?' · <span class="out">oculta por agotada</span>':''}</div>`:''}
    <div class="prices"><div><small>Me costó</small><b>${money(p.costo)}</b></div><div><small>Lo vendo a</small><b>${money(p.precio)}</b></div><div><small>Gano ${mg}%</small><b class="${g<0?'neg':'pos'}">${money(g)}</b></div></div>
    <h4>Stock por talla</h4>
    ${p.tallas.map(t=>{const n=s[t]||0;const e=estado(n,p);return `<div class="trow"><div class="tn">${esc(t)}</div><div class="tq ${e}">${n}<small>${e==='out'?'agotado':e==='low'?'quedan pocas':'unidades'}</small></div><button class="mini" data-mv="entrada" data-t="${esc(t)}">+ Llegó</button><button class="mini pri" data-mv="venta" data-t="${esc(t)}">Vender</button></div>`}).join('')}
    <h4>Últimos movimientos</h4>
    ${ms.length?`<div class="list">${ms.map(m=>movHTML(m,p)).join('')}</div>`:`<div class="sub">Sin movimientos todavía.</div>`}
  </div>
  <div class="sh-foot"><button class="btn" data-edit>Editar producto</button><button class="btn" data-salida>Otra salida</button></div>`);
  sh.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>formMov({pid:id,talla:b.dataset.t,tipo:b.dataset.mv}));
  sh.querySelector('[data-edit]').onclick=()=>formProducto(id);
  sh.querySelector('[data-salida]').onclick=()=>formMov({pid:id,tipo:'salida'});
  sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>verMov(b.dataset.m));
}

function leerFoto(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.74,u2=c.toDataURL('image/jpeg',q);while(u2.length>170000&&q>.35){q-=.1;u2=c.toDataURL('image/jpeg',q)}res(u2)};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

    $('#ptallas').innerHTML=opc.map(t=>`<button data-t="${esc(t)}" class="${sel.includes(t)?'on':''}">${esc(t)}${p?`<small>${s[t]||0} disp.</small>`:''}</button>`).join('');
    $('#pini').innerHTML=!p&&sel.length?`<label class="f">¿Cuántas tienes ahora? (opcional)</label><div class="two">${sel.map(t=>`<div><label class="sub">Talla ${esc(t)}</label><input class="in" inputmode="numeric" data-t="${esc(t)}" placeholder="0" value="${ini[t]||''}"></div>`).join('')}</div>`:''};
  const pintarGan=()=>{const c=num($('#pcos').value),v=num($('#ppre').value);const g=v-c;$('#pgan').innerHTML=v?`Ganancia por prenda: <b class="${g<0?'neg':'pos'}">${money(g)}</b>${v?` (${Math.round(g/v*100)}%)`:''}`:''};
  pintarFoto();pintarTallas();pintarGan();
  if($('#pweb'))$('#pweb').onchange=e=>{f.web=e.target.value;const t=TIENDA.find(x=>x.id===f.web);if(!t||p)return;

    const ts=(Array.isArray(t.o)&&t.o.length?t.o:['Única']).map(x=>String(x).slice(0,12));for(const x of ts)if(!opc.includes(x))opc.push(x);sel=[...ts];pintarTallas()};
  $('#pfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{f.foto=await leerFoto(file);pintarFoto()}catch{toast('No se pudo leer esa foto')}e.target.value=''};
  $('#pquitar').onclick=()=>{f.foto='';pintarFoto()};
  $('#ptallas').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;sel=sel.includes(t)?sel.filter(x=>x!==t):[...sel,t];sel.sort((a,b)=>opc.indexOf(a)-opc.indexOf(b));pintarTallas()};
  $('#padd').onclick=()=>{const t=$('#pnueva').value.trim().slice(0,12);if(!t)return;const ya=opc.find(x=>norm(x)===norm(t));if(ya){if(!sel.includes(ya))sel.push(ya)}else{opc.push(t);sel.push(t)}$('#pnueva').value='';pintarTallas()};
  $('#pnueva').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#padd').click()}};
  bindMoney($('#pcos'),pintarGan);bindMoney($('#ppre'),pintarGan);
  $('#pmin').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,3)};
  if(p)$('#pdel').onclick=async()=>{if(!await pregunta('¿Eliminar este producto?',`"${p.nombre}" desaparece del inventario. Las ventas que ya registraste se quedan en el historial y en los totales.`,'Eliminar',true))return;P=P.filter(x=>x.id!==p.id);cerrar();render();toast('Producto eliminado');guardar(()=>S_.delP(p.id))};
  $('#pok').onclick=async()=>{leerIni();
    const nombre=$('#pnom').value.trim();if(!nombre){$('#pnom').focus();return toast('Escribe el nombre del producto')}
    if(!sel.length)return toast('Elige al menos una talla');
    if(p){for(const t of p.tallas)if(!sel.includes(t)&&(s[t]||0)!==0)return toast(`La talla ${t} todavía tiene ${s[t]} en stock`)}
    if(f.web&&P.some(x=>x.web===f.web&&x.id!==(p&&p.id)))return toast('Ese producto de la página ya está vinculado a otro');
    const mv=$('#pmin').value.trim();
    const o={id:p?.id||uid(),nombre:nombre.slice(0,80),cat:$('#pcat').value.trim().slice(0,40),tallas:sel,costo:num($('#pcos').value),precio:num($('#ppre').value),minimo:mv===''?null:Number(mv),foto:f.foto,creado:p?.creado||Date.now(),web:f.web||undefined};
    const nuevos=p?[]:sel.filter(t=>ini[t]>0).map((t,i)=>({id:uid()+i,pid:o.id,nombre:o.nombre,talla:t,tipo:'entrada',cant:ini[t],precio:o.costo,costo:o.costo,fecha:hoy(),nota:'Stock inicial',ts:Date.now()}));
    P=p?P.map(x=>x.id===o.id?o:x):[...P,o];M.push(...nuevos);
    cerrar();render();toast(p?'Cambios guardados':'Producto agregado');guardar(async()=>{await S_.putP(o);if(nuevos.length)await S_.putMs(nuevos)})};
}

/* ---------- movimientos ---------- */
function movHTML(m,p){const n=p?p.nombre:m.nombre;const sg=m.tipo==='entrada'?'+':'−';
  const amt=m.tipo==='venta'?`<span class="amt">${money(m.cant*m.precio)}</span>`:m.tipo==='entrada'&&m.precio?`<span class="amt sub">${money(m.cant*m.precio)}</span>`:'<span class="amt sub">—</span>';
  return `<button class="mv" data-m="${esc(m.id)}"><span class="sign ${m.tipo}">${sg}${m.cant}</span><span><b>${esc(n)} · ${esc(m.talla)}</b><span class="sub">${TIPOS[m.tipo]}${m.nota?' · '+esc(m.nota):''}</span></span>${amt}</button>`}
function renderMov(){
  $('#fmov').innerHTML=[['todos','Todos'],['venta','Ventas'],['entrada','Entradas'],['salida','Otras salidas']].map(([k,l])=>`<button class="chip ${filtroMov===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  const pm=pmap();let l=M.slice().sort(ordenM);if(filtroMov!=='todos')l=l.filter(m=>m.tipo===filtroMov);
  if(!l.length){$('#movs').innerHTML=`<div class="empty"><b>Sin movimientos</b>Registra lo que llega y lo que vendes con <strong>+ Movimiento</strong>, o desde la ficha de cada producto.</div>`;return}
  const vis=l.slice(0,limite);let h='',dia='';
  for(const m of vis){if(m.fecha!==dia){dia=m.fecha;const v=M.filter(x=>x.fecha===dia&&x.tipo==='venta').reduce((a,x)=>a+x.cant*x.precio,0);h+=`${h?'</div>':''}<div class="day"><span>${esc(fechaTxt(dia))}</span>${v?`<span>Ventas <b>${money(v)}</b></span>`:''}</div><div class="list">`}h+=movHTML(m,pm[m.pid])}
  h+='</div>';if(l.length>limite)h+=`<button class="more" id="mas">Ver más (${l.length-limite} anteriores)</button>`;
  $('#movs').innerHTML=h;if($('#mas'))$('#mas').onclick=()=>{limite+=200;renderMov()};
}
$('#fmov').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filtroMov=b.dataset.f;limite=120;renderMov()});
$('#movs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)verMov(b.dataset.m)});

function verMov(id){const m=M.find(x=>x.id===id);if(!m)return;const p=P.find(x=>x.id===m.pid);
  hoja(`<div class="sh-head"><h3>${TIPOS[m.tipo]}</h3><button class="x" data-close aria-label="Cerrar">×</button></div>
  <div class="sh-body"><dl class="dl">
    <dt>Producto</dt><dd>${esc(p?p.nombre:m.nombre)}${p?'':' (eliminado)'}</dd><dt>Talla</dt><dd>${esc(m.talla)}</dd><dt>Cantidad</dt><dd>${m.cant}</dd>
    ${m.tipo==='venta'?`<dt>Precio</dt><dd>${money(m.precio)} c/u</dd><dt>Total</dt><dd>${money(m.cant*m.precio)}</dd><dt>Ganancia</dt><dd class="${m.precio-m.costo<0?'neg':'pos'}">${money(m.cant*(m.precio-m.costo))}</dd>`:''}
    ${m.tipo==='entrada'?`<dt>Costo</dt><dd>${money(m.precio)} c/u</dd><dt>Total</dt><dd>${money(m.cant*m.precio)}</dd>`:''}
    <dt>Fecha</dt><dd>${esc(fechaTxt(m.fecha,{day:'numeric',month:'long',year:'numeric'}))}</dd>${m.nota?`<dt>Nota</dt><dd>${esc(m.nota)}</dd>`:''}
  </dl><p class="hint">Si te equivocaste, elimínalo y regístralo de nuevo. El stock se recalcula solo.</p></div>
  <div class="sh-foot">${p?'<button class="btn" id="mvp">Ver producto</button>':''}<button class="btn danger" id="mvdel">Eliminar</button></div>`);
  if(p)$('#mvp').onclick=()=>verProducto(p.id);
  $('#mvdel').onclick=async()=>{if(!await pregunta('¿Eliminar este movimiento?','El stock y los totales se ajustan automáticamente.','Eliminar',true))return;M=M.filter(x=>x.id!==id);cerrar();render();toast('Movimiento eliminado');guardar(()=>S_.delM(m))};
}

function formMov(o={}){
  const st={pid:o.pid||null,talla:o.talla||null,tipo:o.tipo||'venta',cant:1,precio:null,fecha:hoy(),nota:'',act:false,bus:''};
  const draw=()=>{
    const p=P.find(x=>x.id===st.pid);const s=p?(stockMap()[p.id]||{}):{};
    if(p&&st.talla&&!p.tallas.includes(st.talla))st.talla=null;
    if(p&&!st.talla&&p.tallas.length===1)st.talla=p.tallas[0];
    const def=p?(st.tipo==='entrada'?p.costo:p.precio):0;const pr=st.precio??def;

    hoja(`<div class="sh-head"><h3>${titulo}</h3><button class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="sh-body">
      <div class="seg" id="mtipo">${Object.entries(TIPOS).map(([k,l])=>`<button data-t="${k}" class="${st.tipo===k?'on':''}">${l}</button>`).join('')}</div>
      <label class="f">Producto</label>
      ${p?`<button class="pick" id="mcambiar">${thumb(p,'sm')}<span><b>${esc(p.nombre)}</b><span class="sub">${esc(p.cat||'Sin categoría')}</span></span><span class="sub">Cambiar</span></button>`
        :`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><input id="mbus" type="search" placeholder="Buscar producto" autocomplete="off" value="${esc(st.bus)}"></div><div class="picklist" id="mres"></div>`}
      ${p?`<label class="f">Talla</label><div class="tallas" id="mtallas">${p.tallas.map(t=>`<button data-t="${esc(t)}" class="${st.talla===t?'on':''}">${esc(t)}<small>${s[t]||0} disp.</small></button>`).join('')}</div>`:''}
      <label class="f" for="mcant">Cantidad</label>
      <div class="step"><button id="mmenos" aria-label="Menos">−</button><input class="in" id="mcant" inputmode="numeric" value="${st.cant}"><button id="mmas" aria-label="Más">+</button></div>
      ${st.tipo!=='salida'?`<label class="f" for="mpre">${st.tipo==='entrada'?'Costo por unidad':'Precio de venta por unidad'}</label><input class="in" id="mpre" inputmode="numeric" placeholder="$0" value="${miles(pr)}"><div class="total" id="mtot"></div>`:''}
      ${st.tipo==='entrada'&&p?`<label class="check"><input type="checkbox" id="mact" ${st.act?'checked':''}>Guardar este costo como el nuevo "me costó" del producto</label>`:''}
      <label class="f" for="mfec">Fecha</label><input class="in" type="date" id="mfec" value="${st.fecha}">
      <label class="f" for="mnota">Nota</label><input class="in" id="mnota" autocomplete="off" value="${esc(st.nota)}" placeholder="${st.tipo==='venta'?'Ej: live del jueves, envío a Cali':st.tipo==='entrada'?'Ej: pedido del proveedor':'Ej: cambio, regalo, prenda dañada'}">
    </div>
    <div class="sh-foot"><button class="btn pri" id="mok">Guardar ${st.tipo==='venta'?'venta':st.tipo==='entrada'?'entrada':'salida'}</button></div>`);
    const tot=()=>{const el=$('#mtot');if(!el)return;const c=num($('#mcant').value),v=st.precio??def;if(!c||!v){el.innerHTML='';return}el.innerHTML=`${c} × ${money(v)} = <b>${money(c*v)}</b>`+(st.tipo==='venta'&&p?` · ganancia <b class="${v-p.costo<0?'neg':'pos'}">${money(c*(v-p.costo))}</b>`:'')};
    tot();
    $('#mtipo').onclick=e=>{const b=e.target.closest('[data-t]');if(!b||b.dataset.t===st.tipo)return;st.tipo=b.dataset.t;st.precio=null;draw()};
    if(p){$('#mcambiar').onclick=()=>{st.pid=null;st.talla=null;st.precio=null;draw()};$('#mtallas').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;st.talla=b.dataset.t;draw()}}
    else{const pintar=()=>{const r=P.filter(x=>!st.bus||norm(x.nombre).includes(norm(st.bus))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).slice(0,40);const S=stockMap();
      $('#mres').innerHTML=P.length?(r.length?r.map(x=>`<button class="pick" data-pid="${esc(x.id)}">${thumb(x,'sm')}<span><b>${esc(x.nombre)}</b><span class="sub">${esc(x.cat||'Sin categoría')} · ${money(x.precio)}</span></span><span class="sub">${x.tallas.reduce((a,t)=>a+((S[x.id]||{})[t]||0),0)} disp.</span></button>`).join(''):'<div class="sub">No encontré ese producto.</div>'):'<div class="sub">Primero agrega productos en Inventario.</div>'};
      pintar();$('#mbus').oninput=e=>{st.bus=e.target.value;pintar()};$('#mres').onclick=e=>{const b=e.target.closest('[data-pid]');if(!b)return;st.pid=b.dataset.pid;st.precio=null;draw()}}

    $('#mfec').onchange=e=>st.fecha=e.target.value;
    $('#mnota').oninput=e=>st.nota=e.target.value;
    $('#mok').onclick=async()=>{
      if(!p)return toast('Elige un producto');if(!st.talla)return toast('Elige la talla');
      const cant=num(cantEl.value);if(cant<1)return toast('La cantidad debe ser al menos 1');
      if(st.tipo!=='entrada'){const d=s[st.talla]||0;if(cant>d)return toast(d>0?`Solo hay ${d} en talla ${st.talla}`:`No hay stock en talla ${st.talla}`)}
      const precio=st.tipo==='salida'?0:(st.precio??def);
      if(st.tipo==='venta'&&!precio)return toast('Escribe el precio de venta');
      const m={id:uid(),pid:p.id,nombre:p.nombre,talla:st.talla,tipo:st.tipo,cant,precio,costo:st.tipo==='entrada'?precio:p.costo,fecha:/^\d{4}-\d{2}-\d{2}$/.test(st.fecha)?st.fecha:hoy(),nota:st.nota.trim().slice(0,140),ts:Date.now()};
      const nuevoCosto=st.tipo==='entrada'&&st.act&&precio&&precio!==p.costo;
      const p2=nuevoCosto?{...p,costo:precio}:null;
      M.push(m);if(p2)P=P.map(x=>x.id===p2.id?p2:x);
      guardar(async()=>{await S_.putMs([m]);if(p2)await S_.putP(p2)});
      cerrar();render();
      const quedan=(stockMap()[p.id]||{})[st.talla]||0;
      toast(st.tipo==='venta'?`Venta guardada · quedan ${quedan} en ${st.talla}`:st.tipo==='entrada'?`Entrada guardada · ahora hay ${quedan}`:`Salida guardada · quedan ${quedan}`)};
  };
  draw();
}

/* ---------- resumen ---------- */
function renderRes(S,bj){
  const h=hoy(),mes=h.slice(0,7);
  const sum=f=>{let t=0,g=0,u=0;for(const m of M)if(m.tipo==='venta'&&f(m)){t+=m.cant*m.precio;g+=m.cant*(m.precio-m.costo);u+=m.cant}return{t,g,u}};
  const d=sum(m=>m.fecha===h),mm=sum(m=>m.fecha.startsWith(mes));
  let uds=0,vc=0,vv=0;for(const p of P){const s=S[p.id]||{};const n=p.tallas.reduce((a,t)=>a+Math.max(0,s[t]||0),0);uds+=n;vc+=n*p.costo;vv+=n*p.precio}
  const nomMes=new Date().toLocaleDateString('es-CO',{month:'long'});
  const dias=C.ultimoBackup?Math.floor((Date.now()-C.ultimoBackup)/864e5):null;
  const recordar=(P.length||M.length)&&(dias===null||dias>=(modo==='nube'?30:7));
  const top={};for(const m of M)if(m.tipo==='venta'&&m.fecha.startsWith(mes))top[m.pid]=(top[m.pid]||0)+m.cant;
  const pm=pmap();const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const gan=P.map(p=>{const n=p.tallas.reduce((a,t)=>a+Math.max(0,(S[p.id]||{})[t]||0),0);return{p,g:p.precio-p.costo,mg:p.precio?Math.round((p.precio-p.costo)/p.precio*100):0,n}}).sort((a,b)=>b.g-a.g);
  $('#res').innerHTML=`
  ${recordar?`<div class="banner"><span>${dias===null?'Aún no has guardado una copia de seguridad.':`Tu última copia fue hace ${dias} días.`}</span><button id="rcopia">Hacer copia</button></div>`:''}
  <div class="card"><h2>Ventas de hoy</h2><div class="big">${money(d.t)}</div><div class="kpis"><div><b>${d.u}</b><span>prendas vendidas</span></div><div><b class="${d.g<0?'neg':'pos'}">${money(d.g)}</b><span>ganancia estimada</span></div></div></div>
  <div class="card"><h2>Ventas de ${esc(nomMes)}</h2><div class="big">${money(mm.t)}</div><div class="kpis"><div><b>${mm.u}</b><span>prendas vendidas</span></div><div><b class="${mm.g<0?'neg':'pos'}">${money(mm.g)}</b><span>ganancia estimada</span></div></div>
    ${tops.length?`<h2 style="margin-top:16px">Lo más vendido del mes</h2>${tops.map(([id,n])=>`<div class="row"><span>${esc(pm[id]?pm[id].nombre:(M.find(m=>m.pid===id)||{}).nombre||'Producto eliminado')}</span><span>${n}</span></div>`).join('')}`:''}</div>
  <div class="card"><h2>Valor del inventario</h2><div class="big">${money(vc)}</div><p>lo que te costó la mercancía que tienes hoy (${uds} prendas)</p>
    <div class="row"><span>Si vendes todo a tu precio</span><span>${money(vv)}</span></div>
    <div class="row"><span>Ganancia posible</span><span class="${vv-vc<0?'neg':'pos'}">${money(vv-vc)}</span></div></div>
  <div class="card"><h2>Stock bajo ${bj.length?`(${bj.length})`:''}</h2>
    ${bj.length?bj.slice(0,30).map(x=>`<button class="row" data-p="${esc(x.p.id)}"><span>${esc(x.p.nombre)}<small>Talla ${esc(x.t)}</small></span><span class="${x.n<=0?'out':'low'}">${x.n<=0?'Agotado':`Quedan ${x.n}`}</span></button>`).join('')+(bj.length>30?`<p>y ${bj.length-30} más. Usa el filtro "Stock bajo" en Inventario.</p>`:''):'<p>Todo bien: ninguna talla está por debajo del aviso.</p>'}</div>
  <div class="card"><h2>Ganancia estimada por prenda</h2>
    ${gan.length?gan.map(x=>`<button class="row" data-p="${esc(x.p.id)}"><span>${esc(x.p.nombre)}<small>${money(x.p.costo)} → ${money(x.p.precio)} · ${x.n} en stock</small></span><span class="${x.g<0?'neg':'pos'}">${money(x.g)}<small>${x.mg}%</small></span></button>`).join(''):'<p>Agrega productos para ver cuánto ganas en cada uno.</p>'}</div>`;
  if($('#rcopia'))$('#rcopia').onclick=()=>{$$('#tabs button')[3].click()};
}
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)verProducto(b.dataset.p)});

/* ---------- ajustes, copia de seguridad, carga CSV ---------- */
const paquete=()=>JSON.stringify({app:'ashen-inventario',version:1,exportado:new Date().toISOString(),productos:P,movimientos:M,config:{minimo:C.minimo}});
const nombreCopia=()=>`ashen-inventario-${hoy()}.json`;
async function bajar(texto,nombre,tipo){
  if(dlc){try{await dlc.save({filename:nombre,data:texto});return true}catch(e){const c=e&&e.code;if(c==='declined')return false;if(c==='host_unavailable'){toast('Aquí no se pueden guardar archivos. Abre la app en el navegador.');return false}if(c==='rate_limited'){toast('Espera un momento y vuelve a intentar');return false}}}
  if(enMarco){toast('No se pudo descargar el archivo aquí');return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:tipo}));a.download=nombre;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true}
function marcarCopia(){C.ultimoBackup=Date.now();guardar(()=>S_.putC());render()}
const puedeCompartir=()=>{if(enMarco)return false;try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.json',{type:'application/json'})]}))}catch(e){return false}};
function renderAj(){
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const ult=C.ultimoBackup?new Date(C.ultimoBackup).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}):'nunca';
  $('#aj').innerHTML=`
  <div class="card"><h2>Copia de seguridad</h2><p>${modo==='nube'?'Tus datos se guardan en privado en tu cuenta de Claude y los ves en cualquier celular o computador donde abras esta app. Igual conviene descargar una copia de vez en cuando.':'Tus datos viven solo en este celular. Guarda una copia cada semana (por ejemplo, mándatela por WhatsApp o súbela a Drive).'} Última copia: <b style="color:var(--ink)">${ult}</b>.</p>
    <div class="btns">${puedeCompartir()?'<button class="btn pri" id="acomp">Compartir copia</button>':''}<button class="btn ${puedeCompartir()?'':'pri'}" id="abajar">Descargar copia</button></div>
    <div class="btns" style="margin-top:10px"><button class="btn" id="arest">Restaurar una copia</button></div></div>
  <div class="card"><h2>Tu página web</h2>
    ${!GH.owner?`<p>${T_TXT['no-web']}: ${esc('ashenco-catalogo.github.io/inventario.html')}</p>`:`
    <p><b style="color:${tEstado==='ok'?'var(--ok)':tEstado==='enviando'||!tEstado?'var(--ink)':'var(--warn)'}">${esc(T_TXT[tEstado]||'Conectando…')}</b></p>
    <p>${P.filter(x=>x.web).length} de ${TIENDA.length} productos de la página están vinculados. Cuando una talla vinculada llega a 0 se oculta en la página (tarda 1 o 2 minutos en verse).</p>
    ${GH.tok&&tEstado!=='llave'?`<div class="btns"><button class="btn pri" id="tya">Actualizar ahora</button><button class="btn" id="ttraer">Traer productos de la página</button></div><button class="linkbtn" id="tsal">Desconectar la llave de este celular</button>`
      :`<label class="f" for="tkey">Llave de GitHub (la misma que usas en #editar)</label><input class="in" id="tkey" type="password" autocomplete="off" placeholder="github_pat_…"><div class="btns" style="margin-top:10px"><button class="btn pri" id="tcon">Conectar</button></div><p class="hint">Si ya entraste a #editar en este celular, se conecta sola.</p>`}`}</div>
  <div class="card"><h2>Cargar productos desde una lista</h2><p>Sube un archivo CSV (de Excel o Google Sheets) con columnas: nombre, categoria, talla, cantidad, costo, precio_venta. Una fila por talla. Se suman a lo que ya tienes.</p>
    <div class="btns"><button class="btn" id="acsv">Cargar CSV</button><button class="btn" id="aplant">Descargar plantilla</button></div></div>
  <div class="card"><h2>Aviso de stock bajo</h2><p>Te aviso cuando una talla tenga esta cantidad o menos. Cada producto puede tener su propio aviso.</p>
    <div class="step"><button id="amen" aria-label="Menos">−</button><input class="in" id="amin" inputmode="numeric" value="${C.minimo}"><button id="amas" aria-label="Más">+</button></div></div>
  <div class="card"><h2>Instalar en el celular</h2>
    ${enMarco?'<p>Para abrirla rápido, guarda el enlace de esta app. Si la abres en el navegador del celular, también puedes usar el menú del navegador y tocar <b style="color:var(--ink)">Agregar a la pantalla de inicio</b> para tener un acceso directo.</p>':standalone?'<p>Ya estás usando la app instalada.</p>':instalar?'<p>Agrégala a tu pantalla de inicio para abrirla como una app, sin barra del navegador.</p><button class="btn pri" id="ainst" style="width:100%">Instalar app</button>':ios?'<p>En Safari toca el botón <b style="color:var(--ink)">Compartir</b> (el cuadrito con la flecha) y luego <b style="color:var(--ink)">Agregar a inicio</b>.</p>':'<p>En Chrome abre el menú <b style="color:var(--ink)">⋮</b> y toca <b style="color:var(--ink)">Agregar a la pantalla principal</b> o <b style="color:var(--ink)">Instalar app</b>.</p>'}</div>
  <div class="card"><h2>Datos</h2><p>${P.length} productos · ${M.length} movimientos guardados ${modo==='nube'?'en tu cuenta':'en este celular'}.</p><button class="btn danger" id="aborrar" style="width:100%">Borrar todos los datos</button></div>
  <p class="sub" style="text-align:center;margin:18px 0 8px">ashen co. · inventario${modo==="nube"?"":" · funciona sin internet"}</p>`;
  if($('#acomp'))$('#acomp').onclick=async()=>{const f=new File([paquete()],nombreCopia(),{type:'application/json'});try{await navigator.share({files:[f],title:'Copia inventario ashen co.'});marcarCopia();toast('Copia compartida')}catch(e){if(e&&e.name!=='AbortError'&&await bajar(paquete(),nombreCopia(),'application/json'))marcarCopia()}};
  $('#abajar').onclick=async()=>{if(await bajar(paquete(),nombreCopia(),'application/json')){marcarCopia();toast('Copia guardada')}};
  $('#arest').onclick=()=>$('#fileJson').click();
  if($('#tya'))$('#tya').onclick=()=>{programarTienda(0)};
  if($('#tsal'))$('#tsal').onclick=async()=>{if(!await pregunta('¿Desconectar la llave?','La página dejará de actualizarse desde este celular hasta que vuelvas a conectarla.','Desconectar',true))return;GH.tok='';try{localStorage.removeItem('ac-gh')}catch(e){}setTienda('sin-llave')};
  if($('#tcon'))$('#tcon').onclick=async()=>{const v=$('#tkey').value.trim();if(!v)return toast('Pega tu llave');$('#tcon').disabled=true;try{await conectarLlave(v);toast('Página conectada');await iniciarTienda()}catch(e){toast('Esa llave no tiene permiso sobre tu página');setTienda('sin-llave')}};
  if($('#ttraer'))$('#ttraer').onclick=traerTienda;
  $('#acsv').onclick=()=>$('#fileCsv').click();
  $('#aplant').onclick=()=>bajar('﻿nombre,categoria,talla,cantidad,costo,precio_venta\nBlusa lino beige,Blusas,S,3,28000,55000\nBlusa lino beige,Blusas,M,4,28000,55000\nJean mom tiro alto,Jeans,8,2,45000,89000\n','plantilla-ashen-inventario.csv','text/csv');
  const setMin=async n=>{C.minimo=Math.max(0,Math.min(999,n));$('#amin').value=C.minimo;guardar(()=>S_.putC());const S=stockMap();const b=bajos(S);$('#badge').textContent=b.length;$('#badge').hidden=!b.length};
  $('#amen').onclick=()=>setMin(C.minimo-1);$('#amas').onclick=()=>setMin(C.minimo+1);
  $('#amin').onchange=e=>setMin(num(e.target.value));
  if($('#ainst'))$('#ainst').onclick=async()=>{instalar.prompt();try{await instalar.userChoice}catch(e){}instalar=null;renderAj()};
  $('#aborrar').onclick=async()=>{if(!await pregunta('¿Borrar todo?','Se eliminan todos los productos, fotos y movimientos. Haz una copia antes si la quieres conservar.','Sí, borrar todo',true))return;if(!await pregunta('¿Seguro?','Esto no se puede deshacer.','Borrar definitivamente',true))return;P=[];M=[];render();toast('Borrando…');if(await guardar(()=>S_.replace([],[])))toast('Datos borrados')};
}
async function traerTienda(){
  try{const {D}=await leerTienda();TIENDA=D.productos||[]}catch(e){return toast('No pude leer tu página. Revisa la conexión.')}
  const libres=TIENDA.filter(t=>!P.some(p=>p.web===t.id));if(!libres.length)return toast('Todos los productos de la página ya están vinculados');
  const porNom=new Map(P.filter(p=>!p.web).map(p=>[norm(p.nombre),p]));
  const vincular=[],crear=[];
  for(const t of libres){const ya=porNom.get(norm(t.n));if(ya){vincular.push([ya,t]);porNom.delete(norm(t.n))}else crear.push(t)}
  if(!await pregunta('¿Traer productos de la página?',`${crear.length} se crean en el inventario${vincular.length?` y ${vincular.length} que ya tenías con el mismo nombre se vinculan`:''}. Después pon cuántas tienes y cuánto te costaron. Mientras no registres stock, la página no cambia.`,'Traer'))return;
  const nuevos=crear.map((t,i)=>limpiarP({id:uid()+'w'+i,nombre:t.n||'Producto',cat:t.c||'',tallas:Array.isArray(t.o)&&t.o.length?t.o:['Única'],costo:0,precio:Number(t.p)||0,minimo:null,foto:fotoOk(t.f)?t.f:'',creado:Date.now(),web:t.id}));
  const cambiados=vincular.map(([p,t])=>({...p,web:t.id}));
  P=[...P.map(p=>cambiados.find(c=>c.id===p.id)||p),...nuevos];render();toast('Productos traídos de la página');
  guardar(()=>pool([...nuevos,...cambiados].map(p=>()=>S_.putP(p))))}
const limpiarP=p=>({id:String(p.id),nombre:String(p.nombre).slice(0,80),cat:String(p.cat||'').slice(0,40),tallas:(Array.isArray(p.tallas)?p.tallas:[]).map(t=>String(t).slice(0,12)).filter((t,i,a)=>t&&a.indexOf(t)===i),costo:Math.max(0,Math.round(Number(p.costo)||0)),precio:Math.max(0,Math.round(Number(p.precio)||0)),minimo:p.minimo==null||p.minimo===''||isNaN(Number(p.minimo))?null:Math.max(0,Math.round(Number(p.minimo))),foto:fotoOk(p.foto)?p.foto:'',creado:Number(p.creado)||Date.now(),web:typeof p.web==='string'&&p.web?p.web.slice(0,80):undefined});
const limpiarM=m=>({id:String(m.id),pid:String(m.pid),nombre:String(m.nombre||'').slice(0,80),talla:String(m.talla).slice(0,12),tipo:TIPOS[m.tipo]?m.tipo:'salida',cant:Math.max(0,Math.round(Number(m.cant)||0)),precio:Math.max(0,Math.round(Number(m.precio)||0)),costo:Math.max(0,Math.round(Number(m.costo)||0)),fecha:/^\d{4}-\d{2}-\d{2}$/.test(m.fecha)?m.fecha:hoy(),nota:String(m.nota||'').slice(0,140),ts:Number(m.ts)||Date.now()});
$('#fileJson').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;let d;try{d=JSON.parse(await file.text())}catch(x){return toast('Ese archivo no es una copia válida')}
  if(!d||!Array.isArray(d.productos)||!Array.isArray(d.movimientos))return toast('Ese archivo no es una copia válida');
  const ps=d.productos.filter(p=>p&&p.id&&p.nombre).map(limpiarP);const ids=new Set(ps.map(p=>p.id));
  const ms=d.movimientos.filter(m=>m&&m.id&&m.pid&&m.talla!=null).map(limpiarM).filter(m=>m.cant>0);
  // asegurar que cada talla con movimientos exista en su producto
  for(const m of ms){const p=ps.find(x=>x.id===m.pid);if(p&&!p.tallas.includes(m.talla))p.tallas.push(m.talla)}
  const cuando=d.exportado?` guardada el ${new Date(d.exportado).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})}`:'';
  if(!await pregunta('¿Restaurar esta copia?',`Copia${cuando}: ${ps.length} productos y ${ms.length} movimientos. Reemplaza todo lo que hay ahora en la app.`,'Restaurar',true))return;
  P=ps;M=ms;if(d.config&&Number.isFinite(Number(d.config.minimo)))C.minimo=Math.max(0,Math.round(Number(d.config.minimo)));render();toast('Restaurando…');
  if(await guardar(async()=>{await S_.replace(ps,ms);await S_.putC()}))toast('Copia restaurada')};

function parseCSV(text){text=text.replace(/^﻿/,'');const l1=text.split('\n')[0]||'';const sep=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':(l1.includes('\t')&&!l1.includes(',')?'\t':',');
  const rows=[];let row=[],f='',inq=false;for(let i=0;i<text.length;i++){const c=text[i];if(inq){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}else if(c==='"')inq=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
const csvNum=v=>num(String(v||'').trim().replace(/[.,]\d{1,2}$/,''));
$('#fileCsv').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  const rows=parseCSV(await file.text());if(rows.length<2)return toast('El archivo está vacío');
  const H=rows[0].map(norm);const col=f=>H.findIndex(f);
  const iN=col(h=>h.includes('nombre')||h==='producto'||h.includes('prenda')),iC=col(h=>h.includes('categ')),iT=col(h=>h.includes('talla')),iQ=col(h=>h.includes('cant')||h.includes('stock')||h.includes('unidades')),iCo=col(h=>h.includes('costo')||h.includes('compra')||h.includes('vale')),iP=col(h=>(h.includes('venta')||h.includes('precio')||h.includes('vendo'))&&!h.includes('compra'));
  if(iN<0)return toast('No encontré la columna "nombre"');
  const nuevosP=[],movs=[],pend=new Map();let actual=0;
  const porNombre=new Map(P.map(p=>[norm(p.nombre),p]));
  for(const r of rows.slice(1)){const nombre=String(r[iN]||'').trim();if(!nombre)continue;const k=norm(nombre);
    const talla=(iT>=0&&String(r[iT]||'').trim())||'Única';const cant=iQ>=0?csvNum(r[iQ]):0;
    let p=porNombre.get(k);
    if(!p){p={id:uid()+nuevosP.length,nombre:nombre.slice(0,80),cat:iC>=0?String(r[iC]||'').trim().slice(0,40):'',tallas:[],costo:iCo>=0?csvNum(r[iCo]):0,precio:iP>=0?csvNum(r[iP]):0,minimo:null,foto:'',creado:Date.now()};porNombre.set(k,p);nuevosP.push(p)}
    else if(!nuevosP.includes(p)&&!pend.has(p.id)){pend.set(p.id,{...p,tallas:[...p.tallas]});actual++}
    const obj=nuevosP.includes(p)?p:pend.get(p.id);
    const t=talla.slice(0,12);if(!obj.tallas.includes(t))obj.tallas.push(t);
    if(cant>0)movs.push({id:uid()+'c'+movs.length,pid:obj.id,nombre:obj.nombre,talla:t,tipo:'entrada',cant,precio:obj.costo,costo:obj.costo,fecha:hoy(),nota:'Carga desde lista',ts:Date.now()})}
  if(!nuevosP.length&&!movs.length&&!pend.size)return toast('No encontré filas para cargar');
  const uds=movs.reduce((a,m)=>a+m.cant,0);
  if(!await pregunta('¿Cargar esta lista?',`${nuevosP.length} productos nuevos${actual?`, ${actual} que ya tenías (se les suman tallas y unidades)`:''} y ${uds} prendas en total.`,'Cargar'))return;
  const cambiados=[...pend.values()];
  P=[...P.map(p=>pend.get(p.id)||p),...nuevosP];M.push(...movs);
  guardar(async()=>{await pool([...nuevosP,...cambiados].map(p=>()=>S_.putP(p)));if(movs.length)await S_.putMs(movs)});vista='inv';$$('#tabs button')[0].click();toast(`Listo: ${nuevosP.length} productos cargados`)};

addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalar=e;if(vista==='aj')renderAj()});
addEventListener('appinstalled',()=>{instalar=null;toast('App instalada')});

async function iniciar(){
  $('#err').hidden=true;$('#lista').innerHTML='<div class="empty"><b>Cargando tu inventario…</b></div>';
  if(window.claude&&typeof window.claude.use==='function'){
    try{const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);dlc=dl;const id=u?await u.id():null;if(d&&id){cdb=d;uidU=id;modo='nube'}}catch(e){}}
  try{await Promise.race([S_.cargar(),espera(12000).then(()=>{throw {code:'timeout'}})]);render()}
  catch(e){console.error(e);const el=$('#err');el.hidden=false;
    el.innerHTML=modo==='nube'?'No pude cargar tu inventario. Revisa tu conexión a internet. <button class="btn" id="reint" style="width:100%;margin-top:10px">Intentar de nuevo</button>':'Este navegador no deja guardar datos (¿modo incógnito?). Abre la app en una ventana normal para que tu inventario quede guardado.';
    if($('#reint'))$('#reint').onclick=iniciar;$('#lista').innerHTML='';if(modo!=='nube')render()}
}
iniciar().then(iniciarTienda);
// al volver a la app, traer cambios hechos desde otro dispositivo
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||modo!=='nube'||pendientes>0||abierta)return;try{await S_.cargar();render()}catch(e){}});
if(!enMarco&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
